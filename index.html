<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMX Project</title>
<style>
/* Layout: header bar; page list on the left, live slide preview in the middle, page or design settings on the right. */
:root{
  --ink:#070b16; --panel:#0c1428; --panel-2:#111c36; --line:#22314f; --line-2:#2c3d60;
  --gold:#d9b25f; --gold-hi:#f6dc9a; --gold-lo:#8a6a2c;
  --text:#ece6d8; --muted:#97a0b2; --danger:#e07a6a; --ok:#7fc79a;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --display:Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* always-visible scroll bars for the page list, the settings panel and the gallery */
.list,.form,.grid{scrollbar-width:auto;scrollbar-color:var(--gold) var(--ink)}
.list::-webkit-scrollbar,.form::-webkit-scrollbar,.grid::-webkit-scrollbar{width:12px}
.list::-webkit-scrollbar-track,.form::-webkit-scrollbar-track,.grid::-webkit-scrollbar-track{background:var(--ink);border-radius:6px}
.list::-webkit-scrollbar-thumb,.form::-webkit-scrollbar-thumb,.grid::-webkit-scrollbar-thumb{background:var(--gold-lo);border-radius:6px;border:2px solid var(--ink)}
.list::-webkit-scrollbar-thumb:hover,.form::-webkit-scrollbar-thumb:hover,.grid::-webkit-scrollbar-thumb:hover{background:var(--gold)}
@media (max-width:820px){.app{height:auto;min-height:100%}}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:14px/1.45 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.app{display:grid;grid-template-rows:56px 1fr;height:100%}
header{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.22em;color:var(--gold-hi)}
.logo small{font-family:var(--ui);font-size:11px;letter-spacing:.06em;color:var(--muted);margin-left:8px;font-weight:500}
.sp{flex:1}
.btn{background:transparent;border:1px solid var(--gold-lo);color:var(--gold-hi);border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
.btn:hover{background:rgba(217,178,95,.1)}
.btn.primary{background:var(--gold);color:#120d04;border-color:var(--gold);font-weight:800;letter-spacing:.04em;padding:8px 16px}
.btn.primary:disabled{background:#3a3424;border-color:#3a3424;color:#857a60;cursor:not-allowed}
.btn.small{padding:4px 9px;font-size:12px}
.file{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.seg{display:flex;gap:2px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{background:none;border:0;padding:4px 9px;border-radius:6px;color:var(--muted);font-weight:700;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#120d04}
main{display:grid;grid-template-columns:260px minmax(0,1fr) 380px;min-height:0}
@media (max-width:1100px){main{grid-template-columns:220px minmax(0,1fr) 320px}}
@media (max-width:820px){main{grid-template-columns:1fr;grid-auto-rows:auto}.stage{order:-1}}

/* page list */
.pages{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.list{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.item{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:2px 8px;align-items:start}
.item:hover{border-color:var(--line-2)}
.item.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.item .num{font-family:var(--display);color:var(--gold);font-weight:700;font-size:16px;grid-row:span 2}
.item .nm{font-weight:700;font-size:13px}
.item .sn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.item .acts{grid-column:2;display:flex;gap:4px;margin-top:4px}
.ic{width:26px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--ink);color:var(--gold-hi);padding:0;font-size:12px;line-height:1}
.ic:disabled{opacity:.3;cursor:default}
.design{margin:10px 10px 0;border:1px dashed var(--gold-lo);border-radius:10px;padding:10px;cursor:pointer;display:flex;gap:10px;align-items:center;background:transparent;color:var(--text);text-align:left;font-weight:700}
.design.sel{border-style:solid;border-color:var(--gold);background:rgba(217,178,95,.08)}
.design .sw{display:flex;gap:3px}
.design .sw i{width:12px;height:22px;border-radius:3px}
.addp{margin:10px;border:1px dashed var(--gold-lo);border-radius:10px;padding:10px;background:none;color:var(--gold-hi);font-weight:700}
.empty{color:var(--muted);font-size:13px;padding:10px;text-align:center}

/* stage */
.stage{display:flex;flex-direction:column;gap:10px;padding:16px;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 40%,#0f1a33,var(--ink) 70%)}
.stagebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stagebar h2{margin:0;font-family:var(--display);font-size:15px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.fitbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.tbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:var(--gold)}
.note{font-size:12px;color:var(--muted)}

/* right panel */
.side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.shead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.shead h3{margin:0;font-size:15px;flex:1;min-width:0}
.shead h3 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:4px;padding:8px 14px 0}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 4px;font-weight:700}
.tabs button[aria-selected="true"]{color:var(--gold-hi);border-bottom-color:var(--gold)}
.form{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
input[type=text],select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;outline:none}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=color]{width:100%;height:36px;padding:2px;background:var(--ink);border:1px solid var(--line);border-radius:7px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.group{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
.group>b{font-size:12px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.media{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:72px;height:48px;border-radius:6px;overflow:hidden;border:1px solid var(--gold-lo);background:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:11px;padding:0}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.preset{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--ink);display:flex;flex-direction:column;gap:5px;align-items:center;font-size:11px;color:var(--muted)}
.preset[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi)}
.preset i{display:flex;width:100%;height:20px;border-radius:4px;overflow:hidden}
.preset i span{flex:1}
.hint{font-size:12px;color:var(--muted);margin:0}
.ovl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}

/* gallery */
.modal{position:fixed;inset:0;background:rgba(3,6,14,.82);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal[hidden]{display:none}
.mbox{width:min(1180px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-family:var(--display);font-size:20px;color:var(--gold-hi);flex:1}
.mhead p{margin:0;color:var(--muted);font-size:13px}
.grid{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;grid-auto-rows:max-content;align-content:start;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{flex-shrink:0;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.card canvas{width:100%;aspect-ratio:16/9;display:block;background:#000}
.card .cb{padding:9px 12px 11px;display:flex;flex-direction:column;gap:2px}
.card .cb b{font-size:14px}.card .cb b em{font-style:normal;color:var(--gold);margin-right:6px;font-family:var(--display)}
.card .cb span{font-size:12px;color:var(--muted)}
.card .added{position:absolute}
.prog{width:min(520px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.prog h2{margin:0;font-family:var(--display);color:var(--gold-hi);font-size:20px}
.pbar{height:10px;background:var(--ink);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .2s}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0d1830;border:1px solid var(--gold);color:var(--gold-hi);padding:9px 16px;border-radius:10px;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">IMX<small data-t="tagline"></small></div>
    <div class="sp"></div>
    <div class="seg" role="group" aria-label="Interface language"><button data-ui="uz">UZ</button><button data-ui="ru">RU</button><button data-ui="en">EN</button></div>
    <button class="btn" id="exampleBtn" data-t="example"></button>
    <button class="btn" id="saveBtn" data-t="save"></button>
    <label class="btn file"><span data-t="open"></span><input type="file" id="openFile" accept=".json,application/json"></label>
    <button class="btn primary" id="createBtn" data-t="create"></button>
  </header>
  <main>
    <section class="pages" aria-label="Pages">
      <button class="design" id="designBtn"><span class="sw" id="designSw"></span><span data-t="design"></span></button>
      <div class="list" id="list"></div>
      <button class="addp" id="addBtn" data-t="addPage"></button>
    </section>
    <section class="stage">
      <div class="stagebar">
        <h2 id="stageTitle"></h2><div class="sp"></div>
        <button class="btn small" id="replayBtn" data-t="replay"></button>
        <button class="btn small" id="fullBtn" data-t="full"></button>
      </div>
      <div class="fitbox" id="fitbox"><canvas id="cv" width="1600" height="900"></canvas></div>
      <div class="tbar"><i id="tbar"></i></div>
      <p class="note" data-t="stageNote"></p>
    </section>
    <aside class="side" id="side"></aside>
  </main>
</div>

<div class="modal" id="gallery" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <div class="mhead"><div style="flex:1"><h2 id="gTitle" data-t="galleryTitle"></h2><p id="gSub" data-t="gallerySub"></p></div>
      <button class="btn primary" id="gDone"></button></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="modal" id="progress" hidden>
  <div class="prog" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <h2 id="pTitle" data-t="making"></h2>
    <div class="pbar"><i id="pbar"></i></div>
    <p class="note" id="pText"></p>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

/* ---------- building slides for a page ---------- */
function slidesFor(id,f,T){const P={c:palette(T)[M[id].group],logo:null};const out=M[id].build(f,P)||[];
  return out.map(s=>({...s,els:s.els.map(e=>({...e}))}))}

/* ---------- drawing (preview) ---------- */
const PX=1/0.6;   /* 1 pt = 1/0.6 design pixels on a 1600-wide slide */
function imgFor(key,T){if(!key)return null;if(T.images&&T.images[key])return T.images[key];
  if(/^(ribbon|soft|photo):/.test(key))return genImage(key,T.accent);return null}
function fontOf(e,T){return e.font==='head'?`"${T.headFont||'Georgia'}", Georgia, serif`:`"${T.bodyFont||'Calibri'}", Calibri, Arial, sans-serif`}
function wrap(x,s,w){const out=[];String(s).split('\n').forEach(p=>{const ws=p.split(/\s+/).filter(Boolean);let line='';if(!ws.length){out.push('');return}
  ws.forEach(word=>{const t=line?line+' '+word:word;if(line&&x.measureText(t).width>w){out.push(line);line=word}else line=t});out.push(line)});return out}
function shapePath(x,e){const{w,h}=e;x.beginPath();
  if(e.t==='oval')x.ellipse(w/2,h/2,w/2,h/2,0,0,7);
  else if(e.t==='round')x.roundRect(0,0,w,h,Math.min(w,h)*(e.r||0));
  else if(e.t==='poly'){e.pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath()}
  else if(e.t==='wave'){const t=e.y;x.moveTo(0,e.yl-t);x.bezierCurveTo(w*.25,e.yl-t,w*.32,e.ym-t,w*.5,e.ym-t);x.bezierCurveTo(w*.68,e.ym-t,w*.75,e.yr-t,w,e.yr-t);x.lineTo(w,h);x.lineTo(0,h);x.closePath()}
  else x.rect(0,0,w,h)}
function drawEl(x,e,T,alpha=1,mult=1){if(alpha<=0.003||e.w<.5&&e.h<.5)return;x.save();x.globalAlpha=alpha*(e.t==='pic'||e.t==='text'?1:(e.a??1));
  x.translate(e.x+e.w/2,e.y+e.h/2);if(e.rot)x.rotate(e.rot*Math.PI/180);if(e.sc&&e.sc!==1)x.scale(e.sc,e.sc);x.translate(-e.w/2,-e.h/2);
  if(e.t==='pic'){const im=imgFor(e.img,T);x.globalAlpha=alpha*(e.a??1);x.beginPath();x.roundRect(0,0,e.w,e.h,Math.min(e.w,e.h)*(e.r||0));x.clip();
    if(im){const k=Math.max(e.w/im.width,e.h/im.height);x.drawImage(im,(e.w-im.width*k)/2,(e.h-im.height*k)/2,im.width*k,im.height*k)}else{x.fillStyle='#334';x.fillRect(0,0,e.w,e.h)}}
  else if(e.t==='text'){if(e.tx){const size=e.sz*PX*mult;x.font=`${e.b?700:400} ${size}px ${fontOf(e,T)}`;if('letterSpacing' in x)x.letterSpacing=((e.sp||0)*PX)+'px';
    const lines=wrap(x,e.tx,e.w+2),lh=size*1.2*(e.lh||1),bh=lines.length*lh,y0=e.va==='m'?(e.h-bh)/2:e.va==='b'?e.h-bh:0;
    const paint=ctx=>{ctx.textBaseline='alphabetic';ctx.textAlign='left';ctx.direction='ltr';lines.forEach((ln,i)=>{const lw=ctx.measureText(ln).width,X=e.al==='c'?(e.w-lw)/2:e.al==='r'?e.w-lw:0;ctx.fillText(ln,X,y0+i*lh+size*.95)})};
    const im=e.fillImg&&imgFor(e.fillImg,T);
    if(im){const c2=document.createElement('canvas');c2.width=Math.ceil(e.w);c2.height=Math.ceil(e.h);const y=c2.getContext('2d');y.font=x.font;if('letterSpacing' in y)y.letterSpacing=x.letterSpacing;y.fillStyle='#000';paint(y);
      y.globalCompositeOperation='source-in';const k=Math.max(e.w/im.width,e.h/im.height);y.drawImage(im,(e.w-im.width*k)/2,(e.h-im.height*k)/2,im.width*k,im.height*k);x.drawImage(c2,0,0)}
    else{x.fillStyle=e.col;paint(x)}}}
  else{shapePath(x,e);if(e.fill){x.fillStyle=e.fill;x.fill()}if(e.line){x.globalAlpha=alpha;x.strokeStyle=e.line;x.lineWidth=(e.lw||1)*PX;x.stroke()}}

  const setv=sp=>`<p:set><p:cBhvr><p:cTn id="${T()}" dur="1" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst></p:cTn>${tgt(sp)}<p:attrNameLst><p:attrName>style.visibility</p:attrName></p:attrNameLst></p:cBhvr><p:to><p:strVal val="visible"/></p:to></p:set>`;
  const anim=(sp,at,a,b,d)=>`<p:anim calcmode="lin" valueType="num"><p:cBhvr additive="base"><p:cTn id="${T()}" dur="${d}" fill="hold"/>${tgt(sp)}<p:attrNameLst><p:attrName>${at}</p:attrName></p:attrNameLst></p:cBhvr><p:tavLst><p:tav tm="0"><p:val><p:strVal val="${a}"/></p:val></p:tav><p:tav tm="100000"><p:val><p:strVal val="${b}"/></p:val></p:tav></p:tavLst></p:anim>`;
  const fx=(sp,d)=>`<p:animEffect transition="in" filter="fade"><p:cBhvr><p:cTn id="${T()}" dur="${d}"/>${tgt(sp)}</p:cBhvr></p:animEffect>`;
  let body='',first=true;const builds=new Set();

      body+=`<p:par><p:cTn id="${outer}" presetID="${preset}" presetClass="entr" presetSubtype="${a.k==='zoom'?16:0}" fill="hold" grpId="0" nodeType="${node}"><p:stCondLst><p:cond delay="${delay}"/></p:stCondLst><p:childTnLst>${inner}</p:childTnLst></p:cTn></p:par>`;builds.add(sp)}

  for(let i=0;i<pages.length;i++){const p=pages[i],T=themeFor(p),st=ST.S[p.style];

    if(st.kind==='morph'){const slides=MO.slidesFor(p.style,p.f,T),mult=ST.SIZES[T.size]||1;

      for(const [key,png] of need){const kk=key+'|'+T.accent+(png?'|png':'');if(IMGS.has(kk))continue;const src=MO.imgFor(key,T);if(!src){IMGS.set(kk,null);continue}
        const enc=await encodeImage(src,png),file=`imx_img${++imgN}.${png?'png':'jpeg'}`;zip.file('ppt/media/'+file,enc.data);IMGS.set(kk,{file,w:enc.w,h:enc.h})}
      for(const s of slides){n++;const rels=[],rid={};

    else{zip.file(`ppt/media/anim${n}.gif`,await renderGIF(p,T,dur,prog));media={type:'gif'}}
    const measure=s=>ST.fitFor(meas,s,T);measure.color=s=>ST.colorFor(meas,s,T);
    zip.file(`ppt/slides/slide${n}.xml`,slideXML(p,T,media,ln,measure));zip.file(`ppt/slides/_rels/slide${n}.xml.rels`,slideRels(n,media))}

  zip.file('ppt/presentation.xml',pres);
  let rels=await zip.file('ppt/_rels/presentation.xml.rels').async('string');

  ct=ct.replace('</Types>',idx.map(i=>`<Override PartName="/ppt/slides/slide${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`).join('')+'</Types>');

})();

const t=(k,v)=>{let s=UI[ui][k]??UI.en[k]??k;if(v)for(const n in v)s=s.replace('{'+n+'}',v[n]);return s};

/* ---------- state ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9);
function blank(){return{v:2,lang:'uz',title:'',theme:{preset:'navy',...ST.THEMES.navy,name:undefined,headFont:'Georgia',bodyFont:'Calibri',size:'M',effect:'rise',speed:'normal',bgImg:'',bgVis:35},pages:[],images:{}}}
let S=blank(),sel='theme',tab='content';

/* pictures: stored as data URLs in the project, kept as Image objects for drawing */
const IMGS={};
function imgObj(id){if(!id||!S.images[id])return null;if(!IMGS[id]){const im=new Image();im.onload=()=>draw();im.src=S.images[id];IMGS[id]=im}return IMGS[id].complete&&IMGS[id].naturalWidth?IMGS[id]:null}
async function readImage(file,max=1920){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  if(/svg|gif/.test(file.type))return url;
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const k=Math.min(1,max/Math.max(im.width,im.height));if(k===1&&file.size<700000)return url;
  const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.86)}
async function addImage(file){const id=uid();S.images[id]=await readImage(file);return id}
/* theme for one page: deck values, with the page's own overrides on top */
function themeFor(p){const T={...S.theme};if(p&&p.ov)for(const k in p.ov)if(p.ov[k]!==''&&p.ov[k]!=null)T[k]=p.ov[k];
  const images={};for(const id in S.images){const o=imgObj(id);if(o)images[id]=o}
  return{...T,bgVis:(+T.bgVis||0)/100,bgImg:imgObj(T.bgImg),images}}

/* ---------- small helpers ---------- */
let toastT=0;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2800)}
function getPath(o,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,path,v){const ks=path.split('.');let a=o;ks.slice(0,-1).forEach(k=>{a=a[k]});a[ks[ks.length-1]]=v}
function styleName(id){const st=ST.S[id];return st.name[ui]||st.name.en}
function styleUse(id){const st=ST.S[id];return st.use[ui]||st.use.en}
function snippet(p){const f=p.f;return f.heading||f.title||f.word||f.sentence||(f.lines&&f.lines.map(l=>l.text).join(' '))||''}

/* ---------- live preview ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let t0=performance.now(),hold=false;
function curPage(){return S.pages.find(p=>p.id===sel)}
function draw(){const p=curPage()||S.pages[0];if(!p){ctx.save();ctx.fillStyle='#070b16';ctx.fillRect(0,0,1600,900);ctx.fillStyle='#97a0b2';ctx.font='32px Georgia';ctx.textAlign='center';ctx.fillText(t('noPages'),800,460);ctx.restore();return}
  const st=ST.S[p.style],dur=ST.durOf(st,p.f)+2.4,el=(performance.now()-t0)/1000,tt=hold?dur:Math.min(el,dur);
  try{ST.render(ctx,p.style,p.f,tt,themeFor(p))}catch(e){console.error(e)}
  $('tbar').style.width=(Math.min(1,tt/dur)*100)+'%'}
(function loop(){draw();requestAnimationFrame(loop)})();
function replay(){hold=false;t0=performance.now()}
function showEnd(){hold=true}
$('replayBtn').onclick=replay;
$('fullBtn').onclick=()=>{try{cv.requestFullscreen().catch(()=>{})}catch(_){}};
function sizeCanvas(){const b=$('fitbox'),w=b.clientWidth,h=b.clientHeight;if(!h)return;const k=Math.min(w/16,h/9);cv.style.width=Math.floor(k*16)+'px'}
new ResizeObserver(sizeCanvas).observe($('fitbox'));

/* ---------- page list ---------- */
let armDel=null;
function renderList(){
  const L=$('list');
  if(!S.pages.length){L.innerHTML=`<div class="empty">${esc(t('noPages'))}</div>`}
  else L.innerHTML=S.pages.map((p,i)=>`<div class="item${p.id===sel?' sel':''}" data-id="${p.id}" tabindex="0" role="button" aria-label="${i+1}. ${esc(styleName(p.style))}">
      <span class="num">${String(i+1).padStart(2,'0')}</span><span class="nm">${esc(styleName(p.style))}</span><span class="sn">${esc(snippet(p))||'&nbsp;'}</span>
      <span class="acts"><button class="ic" data-a="up" ${i?'':'disabled'} aria-label="${esc(t('up'))}">↑</button><button class="ic" data-a="down" ${i<S.pages.length-1?'':'disabled'} aria-label="${esc(t('down'))}">↓</button>
      <button class="ic" data-a="dup" aria-label="${esc(t('dup'))}">⧉</button><button class="ic" data-a="del" aria-label="${esc(t('del'))}">✕</button></span></div>`).join('');
  L.querySelectorAll('.item').forEach(el=>{const id=el.dataset.id;
    el.onclick=e=>{const a=e.target.closest('[data-a]');if(a){act(id,a.dataset.a);return}select(id)};
    el.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===el){e.preventDefault();select(id)}}});
  $('designBtn').classList.toggle('sel',sel==='theme');
  const T=S.theme;$('designSw').innerHTML=[T.bg,T.accent,T.text].map(c=>`<i style="background:${c}"></i>`).join('');
  $('createBtn').disabled=!S.pages.length;
}
function act(id,a){const i=S.pages.findIndex(p=>p.id===id);if(i<0)return;
  if(a==='up'&&i>0)[S.pages[i-1],S.pages[i]]=[S.pages[i],S.pages[i-1]];
  if(a==='down'&&i<S.pages.length-1)[S.pages[i+1],S.pages[i]]=[S.pages[i],S.pages[i+1]];
  if(a==='dup'){const c=clone(S.pages[i]);c.id=uid();S.pages.splice(i+1,0,c);sel=c.id}
  if(a==='del'){if(armDel!==id){armDel=id;toast(t('delConfirm'));setTimeout(()=>{if(armDel===id)armDel=null},3000);return}
    armDel=null;S.pages.splice(i,1);if(sel===id)sel=S.pages[Math.min(i,S.pages.length-1)]?.id||'theme'}
  changed();renderList();renderSide();replay()}
function select(id){sel=id;renderList();renderSide();replay()}
$('designBtn').onclick=()=>select('theme');

/* ---------- right panel ---------- */
function renderSide(){const p=curPage(),side=$('side');
  $('stageTitle').textContent=p?`${String(S.pages.indexOf(p)+1).padStart(2,'0')} · ${styleName(p.style)}`:t('design');
  if(!p){side.innerHTML=`<div class="shead"><h3>${esc(t('design'))}</h3></div><div class="form" id="form"></div>`;themeForm($('form'),S.theme,false);return}
  const st=ST.S[p.style];
  side.innerHTML=`<div class="shead"><h3>${esc(styleName(p.style))}<small>${esc(styleUse(p.style))}</small></h3><button class="btn small" id="chg">${esc(t('changeStyle'))}</button></div>
    <div class="tabs" role="tablist"><button role="tab" data-tab="content" aria-selected="${tab==='content'}">${esc(t('content'))}</button><button role="tab" data-tab="look" aria-selected="${tab==='look'}">${esc(t('look'))}</button></div>
    <div class="form" id="form"></div>`;
  side.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderSide()});
  $('chg').onclick=()=>openGallery(p.id);
  const form=$('form');
  if(tab==='content'){if(st.textInVideo)form.insertAdjacentHTML('beforeend',`<p class="hint">${esc(t('textInVideo'))}</p>`);
    if(st.kind==='morph')form.insertAdjacentHTML('beforeend',`<p class="hint">${esc(t('morphNote',{n:IMXMorph.slidesFor(p.style,p.f,themeFor(p)).length}))}</p>`);fieldsForm(form,p,st.fields,'')}
  else{form.insertAdjacentHTML('beforeend',`<p class="hint">${esc(t('pageHint'))}</p>`);p.ov=p.ov||{};themeForm(form,p.ov,true)}}

function fieldsForm(root,p,fields,prefix){
  fields.forEach(fd=>{const path=prefix+fd.k,val=getPath(p.f,path);
    if(fd.t==='text'||fd.t==='area'){const w=document.createElement('label');w.className='f';
      w.innerHTML=`<span>${esc(t(fd.k))}${fd.max?`<em style="font-style:normal">${esc(t('max13'))}</em>`:''}</span>`+(fd.t==='area'?`<textarea rows="3"></textarea>`:`<input type="text"${fd.max?` maxlength="${fd.max}"`:''}>`);
      const inp=w.querySelector('input,textarea');inp.value=val||'';inp.oninput=()=>{setPath(p.f,path,inp.value);changed(true);renderListSoon()};root.appendChild(w)}
    else if(fd.t==='img'){const w=document.createElement('div');w.className='f';w.innerHTML=`<span>${esc(t(fd.k))}</span><div class="media"></div>`;
      imagePicker(w.querySelector('.media'),()=>getPath(p.f,path),v=>{setPath(p.f,path,v);changed(true)});root.appendChild(w)}
    else if(fd.t==='choice'){const w=document.createElement('label');w.className='f';w.innerHTML=`<span>${esc(t(fd.k))}</span><select>${fd.opts.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select>`;
      w.querySelector('select').onchange=e=>{setPath(p.f,path,e.target.value);changed(true)};root.appendChild(w)}
    else if(fd.t==='list'){const arr=getPath(p.f,path)||[];setPath(p.f,path,arr);const g=document.createElement('div');g.className='group';
      g.innerHTML=`<b>${esc(t(fd.k))} <span>${arr.length} / ${fd.max}</span></b>`;
      arr.forEach((_,i)=>{const it=document.createElement('div');it.className='group';it.style.background='var(--ink)';
        it.innerHTML=`<b>${i+1}${arr.length>fd.min?`<button class="ic" aria-label="${esc(t('remove'))}">✕</button>`:''}</b>`;
        const rm=it.querySelector('.ic');if(rm)rm.onclick=()=>{arr.splice(i,1);changed();renderSide()};
        fieldsForm(it,p,fd.of,`${path}.${i}.`);g.appendChild(it)});
      if(arr.length<fd.max){const add=document.createElement('button');add.className='btn small';add.textContent=t('add');
        add.onclick=()=>{const o={};fd.of.forEach(s=>{o[s.k]=s.t==='choice'?s.opts[0]:''});arr.push(o);changed();renderSide()};g.appendChild(add)}
      root.appendChild(g)}});}
function imagePicker(box,get,set){
  const drawP=()=>{const id=get(),src=id&&S.images[id];
    box.innerHTML=(src?`<span class="thumb"><img alt="" src="${src}"><button aria-label="${esc(t('remove'))}">✕</button></span>`:'')+`<label class="btn small file">${esc(t('addImg'))}<input type="file" accept="image/*"></label>`;
    box.querySelector('input').onchange=async e=>{const f=e.target.files[0];if(!f)return;set(await addImage(f));drawP()};
    const x=box.querySelector('.thumb button');if(x)x.onclick=()=>{set('');drawP()}};drawP()}

/* design form, used for the whole deck and (with "deck default" options) for one page */
function themeForm(root,o,page){
  const opt=(v,label,cur)=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(label)}</option>`;
  const dflt=page?opt('',t('useDeck'),o.x??''):'';
  let h='';
  if(!page)h+=`<div class="group"><label class="f"><span>${esc(t('deckTitle'))}</span><input type="text" id="dTitle"></label>
    <label class="f"><span>${esc(t('plang'))}</span><select id="dLang">${opt('uz',"O'zbekcha",S.lang)}${opt('ru','Русский',S.lang)}${opt('en','English',S.lang)}</select></label></div>`;
  if(!page)h+=`<div class="group"><b>${esc(t('themes'))}</b><div class="presets">${Object.entries(ST.THEMES).map(([k,v])=>`<button class="preset" data-p="${k}" aria-pressed="${S.theme.preset===k}"><i><span style="background:${v.bg}"></span><span style="background:${v.accent}"></span><span style="background:${v.text}"></span></i>${esc(v.name)}</button>`).join('')}</div></div>`;
  h+=`<div class="group"><b>${esc(t('colors'))}</b><div class="row3">${['bg','accent','text'].map(k=>`<label class="f"><span>${esc(t(k==='text'?'textc':k))}</span><input type="color" data-c="${k}" value="${o[k]||S.theme[k]}"></label>`).join('')}</div>
    ${page?`<label class="ovl"><input type="checkbox" id="ownColors" ${o.bg||o.accent||o.text?'checked':''}> ${esc(t('pageOwn'))}</label>`:''}</div>`;
  h+=`<div class="group"><b>${esc(t('fonts'))}</b>
    <label class="f"><span>${esc(t('headFont'))}</span><select data-k="headFont">${dflt}${ST.FONTS.head.map(f=>`<option value="${f}" style="font-family:'${f}'"${o.headFont===f?' selected':''}>${f}</option>`).join('')}</select></label>
    <label class="f"><span>${esc(t('bodyFont'))}</span><select data-k="bodyFont">${dflt}${ST.FONTS.body.map(f=>`<option value="${f}" style="font-family:'${f}'"${o.bodyFont===f?' selected':''}>${f}</option>`).join('')}</select></label>
    <label class="f"><span>${esc(t('size'))}</span><select data-k="size">${dflt}${['S','M','L'].map(s=>opt(s,t(s),o.size)).join('')}</select></label></div>`;
  h+=`<div class="group"><b>${esc(t('anim'))}</b><div class="row2">
    <label class="f"><span>${esc(t('effect'))}</span><select data-k="effect">${dflt}${ST.EFFECTS.map(e=>opt(e,t('e_'+e),o.effect)).join('')}</select></label>
    <label class="f"><span>${esc(t('speed'))}</span><select data-k="speed">${dflt}${['slow','normal','fast'].map(s=>opt(s,t(s),o.speed)).join('')}</select></label></div></div>`;
  h+=`<div class="group"><b>${esc(t('bgImage'))}</b><div class="media" id="bgPick"></div>
    <label class="f"><span>${esc(t('vis'))} <output id="visOut"></output></span><input type="range" min="0" max="100" id="vis"></label></div>`;
  root.insertAdjacentHTML('beforeend',h);
  if(!page){const ti=$('dTitle');ti.value=S.title;ti.oninput=()=>{S.title=ti.value;changed(true)};
    $('dLang').onchange=e=>{S.lang=e.target.value;changed(true)};
    root.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const v=ST.THEMES[b.dataset.p];Object.assign(S.theme,{preset:b.dataset.p,bg:v.bg,accent:v.accent,text:v.text});changed();renderSide();renderList()})}
  root.querySelectorAll('select[data-k]').forEach(s=>s.onchange=()=>{o[s.dataset.k]=s.value;changed(true)});
  const own=root.querySelector('#ownColors');
  root.querySelectorAll('[data-c]').forEach(inp=>inp.oninput=()=>{if(page&&own)own.checked=true;o[inp.dataset.c]=inp.value;if(!page)S.theme.preset='';changed(true);renderList()});
  if(own)own.onchange=()=>{if(own.checked){['bg','accent','text'].forEach(k=>{o[k]=root.querySelector(`[data-c="${k}"]`).value})}else{delete o.bg;delete o.accent;delete o.text}changed(true)};
  imagePicker($('bgPick'),()=>o.bgImg,v=>{o.bgImg=v;changed(true)});
  const vis=$('vis'),vo=$('visOut');vis.value=o.bgVis??S.theme.bgVis;vo.textContent=vis.value+'%';vis.oninput=()=>{o.bgVis=+vis.value;vo.textContent=vis.value+'%';changed(true)};
}

/* ---------- style gallery ---------- */
let gMode=null,gAdded=0,gRaf=0;
function openGallery(replaceId){gMode=replaceId||null;gAdded=0;
  $('gTitle').textContent=gMode?t('replaceTitle'):t('galleryTitle');$('gSub').style.display=gMode?'none':'';
  const grid=$('grid');grid.innerHTML=ST.ORDER.map(id=>{const st=ST.S[id];return`<button class="card" data-s="${id}"><canvas width="480" height="270"></canvas><span class="cb"><b><em>${st.n}</em>${esc(styleName(id))}</b><span>${esc(styleUse(id))}</span></span></button>`}).join('');
  grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>pick(c.dataset.s));
  updDone();$('gallery').hidden=false;grid.querySelector('.card').focus();
  const cards=[...grid.querySelectorAll('canvas')].map((c,i)=>({c,x:c.getContext('2d'),id:ST.ORDER[i],f:clone(ST.S[ST.ORDER[i]].sample)})),T0=performance.now();
  let k=0;cancelAnimationFrame(gRaf);
  (function loop(now){const T=themeFor(null);
    /* draw a few thumbnails per frame so the gallery stays smooth */
    for(let j=0;j<4;j++){const o=cards[k++%cards.length],d=ST.durOf(ST.S[o.id],o.f)+2;o.x.setTransform(.3,0,0,.3,0,0);
      try{ST.render(o.x,o.id,o.f,((now-T0)/1000+cards.indexOf(o)*.37)%d,T)}catch(e){}}
    if(!$('gallery').hidden)gRaf=requestAnimationFrame(loop)})(T0);}
function updDone(){$('gDone').textContent=gAdded?t('doneN',{n:gAdded}):t('done')}
function pick(id){
  if(gMode){const p=S.pages.find(q=>q.id===gMode);if(p){const old=p.f;p.style=id;p.f=clone(ST.S[id].sample);if(old.heading&&'heading' in p.f)p.f.heading=old.heading}closeGallery();changed();renderList();renderSide();replay();return}
  const p={id:uid(),style:id,f:clone(ST.S[id].sample),ov:{}},i=S.pages.findIndex(q=>q.id===sel);
  S.pages.splice(i<0?S.pages.length:i+1,0,p);sel=p.id;gAdded++;updDone();changed();renderList();renderSide();replay();toast('+ '+styleName(id))}
function closeGallery(){$('gallery').hidden=true;cancelAnimationFrame(gRaf)}
$('gDone').onclick=closeGallery;$('addBtn').onclick=()=>openGallery(null);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('gallery').hidden)closeGallery()});

/* ---------- create the PPTX ---------- */
function b64bytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const fileName=ext=>((S.title||snippet(S.pages[0]||{f:{}})||'IMX').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim().slice(0,60)||'IMX')+ext;
$('createBtn').onclick=async()=>{if(!S.pages.length)return;
  /* make sure every picture is decoded before drawing frames */
  await Promise.all(Object.keys(S.images).map(id=>new Promise(r=>{const o=imgObj(id);if(o)return r();const im=IMGS[id];im.onload=()=>{r();draw()};im.onerror=r})));
  $('progress').hidden=false;$('pbar').style.width='0%';$('pText').textContent='';
  try{const {blob,mode}=await IMXExport.build({pages:S.pages,themeFor,lang:S.lang,template:b64bytes(TEMPLATE_B64),title:S.title},
      p=>{$('pbar').style.width=Math.round(p.frac*100)+'%';$('pText').textContent=p.packing?t('packing'):t('slideOf',{n:p.slide,t:p.total})+' · '+(p.mode==='mp4'?'MP4':'GIF')});
    const name=fileName('.pptx');download(name,blob);$('progress').hidden=true;toast(t('created',{f:name}));if(mode==='gif')setTimeout(()=>toast(t('madeGif')),3000);if(mode==='shapes')setTimeout(()=>toast(t('madeShapes')),3000)}
  catch(e){console.error(e);$('progress').hidden=true;toast(t('failed',{e:e.message||e}))}};

/* ---------- save, open, example ---------- */
$('saveBtn').onclick=()=>{download(fileName('.imx.json'),new Blob([JSON.stringify({imx:2,...S})],{type:'application/json'}));toast(t('saved'))};
$('openFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());if(!o||o.imx!==2||!Array.isArray(o.pages))throw 0;load(o);toast(t('opened'))}catch(_){toast(t('badfile'))}};
let exArm=0;
$('exampleBtn').onclick=()=>{if(S.pages.length&&Date.now()-exArm>3000){exArm=Date.now();toast(t('confirmEx'));return}
  const e=blank();e.title='Namuna taqdimot';e.pages=['glassTitle','split','accordion','points','stats','wheel','flipCards','quiz','contact','kinetic'].map(id=>({id:uid(),style:id,f:clone(ST.S[id].sample),ov:{}}));
  e.pages[e.pages.length-1].f.sentence='E\'tiboringiz uchun rahmat';load(e)};
function load(o){const b=blank();S={...b,...o,theme:{...b.theme,...(o.theme||{})},images:o.images||{}};delete S.imx;
  S.pages.forEach(p=>{p.id=p.id||uid();p.ov=p.ov||{};if(!ST.S[p.style])p.style='split'});
  for(const k in IMGS)delete IMGS[k];sel=S.pages[0]?.id||'theme';tab='content';renderList();renderSide();replay();saveSoon()}

/* ---------- autosave and refresh ---------- */
let saveT=0,listT=0;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('imx2',JSON.stringify(S))}catch(_){try{localStorage.setItem('imx2',JSON.stringify({...S,images:{}}))}catch(__){}}},700)}
function renderListSoon(){clearTimeout(listT);listT=setTimeout(renderList,300)}
function changed(quiet){saveSoon();if(quiet)showEnd()}

/* ---------- start ---------- */
function applyUI(){document.documentElement.lang=ui;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('[data-ui]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ui===ui));renderList();renderSide();updDone()}
document.querySelectorAll('[data-ui]').forEach(b=>b.onclick=()=>{ui=b.dataset.ui;try{localStorage.setItem('imx-ui',ui)}catch(_){}applyUI()});
try{ui=localStorage.getItem('imx-ui')||'uz'}catch(_){}if(!UI[ui])ui='uz';
let saved=null;try{saved=JSON.parse(localStorage.getItem('imx2')||'null')}catch(_){}
applyUI();if(saved&&saved.pages)load(saved);else{renderList();renderSide()}
if(!S.pages.length)openGallery(null);
</script>
</body>
