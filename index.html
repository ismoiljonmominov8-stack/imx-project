<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMX Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed sidebar editor on the left, live 16:9 preview on the right. Navy and gold to match the presentations. */
:root{
  --ink:#060a14; --panel:#0b1326; --panel-2:#101b33; --line:#22314f;
  --gold:#d9b25f; --gold-hi:#f6dc9a; --gold-lo:#8a6a2c;
  --text:#ece6d8; --muted:#9aa0ad; --danger:#e07a6a; --ok:#7fc79a;
  --caps:"Cinzel",Georgia,serif; --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:14px/1.45 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:420px 1fr;height:100%}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100%}.stage-wrap{position:sticky;top:0;order:-1}}

/* sidebar */
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--caps);font-weight:700;font-size:22px;letter-spacing:.24em;color:var(--gold-hi)}
.logo small{display:block;font-family:var(--ui);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.langs{display:flex;gap:2px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px}
.langs button{background:none;border:0;padding:5px 9px;border-radius:6px;color:var(--muted);font-weight:700;font-size:12px}
.langs button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.scroll{flex:1;overflow-y:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:10px}
.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:700;letter-spacing:.02em}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .n{font-family:var(--caps);color:var(--gold);font-size:13px;min-width:22px}
.sec>summary .st{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted)}
.sec>summary .st.req{color:var(--danger)}
.sec>summary .st.done{color:var(--ok)}
.sec>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.sec[open]>summary::after{transform:rotate(180deg)}
.body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;color:var(--muted);font-weight:600}
.f>span b{color:var(--danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px 10px;outline:none}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input.bad{border-color:var(--danger)}
.hint{font-size:12px;color:var(--muted)}
.media{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.add{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--gold-lo);color:var(--gold-hi);background:transparent;border-radius:8px;padding:8px 12px;font-weight:600;position:relative}
.add:hover{background:rgba(217,178,95,.08)}
.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumb{position:relative;width:64px;height:48px;border-radius:6px;overflow:hidden;border:1px solid var(--gold-lo);background:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.round{width:52px;height:52px;border-radius:50%}
.thumb .x,.mini{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:12px;line-height:20px;padding:0}
.chipfile{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--ink);border:1px solid var(--line);font-size:12px}
.chipfile button{background:none;border:0;color:var(--danger);padding:0 2px}
.page{border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.page.off{opacity:.55}
.phead{display:flex;align-items:center;gap:8px;padding:9px 10px}
.phead .type{font-family:var(--caps);font-size:11px;letter-spacing:.14em;color:var(--gold);width:96px;flex:none}
.phead input[type=text]{padding:6px 8px}
.icon{width:30px;height:30px;flex:none;border-radius:7px;border:1px solid var(--line);background:var(--ink);color:var(--gold-hi);padding:0;display:grid;place-items:center}
.icon:disabled{opacity:.3;cursor:default}
.pbody{padding:2px 10px 12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.pbody[hidden]{display:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw input{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked{background:var(--gold)}
.sw input:checked::after{left:21px}
.sw input:focus-visible,.icon:focus-visible,button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
input[type=color]{width:100%;height:38px;padding:2px;background:var(--ink);border:1px solid var(--line);border-radius:7px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--gold)}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;position:relative;background:var(--ink)}
.card .del{position:absolute;top:8px;right:8px}
.ghost{background:transparent;border:1px solid var(--gold-lo);color:var(--gold-hi);border-radius:8px;padding:8px 12px;font-weight:600}
.ghost:hover{background:rgba(217,178,95,.08)}

/* footer */
.foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.foot .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.create{background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:14px;font-weight:800;font-size:16px;letter-spacing:.06em}
.create:disabled{background:#3a3424;color:#857a60;cursor:not-allowed}
.missing{font-size:12px;color:var(--danger);text-align:center;min-height:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d1830;border:1px solid var(--gold);color:var(--gold-hi);padding:10px 16px;border-radius:10px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* preview */
.stage-wrap{display:flex;flex-direction:column;gap:12px;padding:18px;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 40%,#0f1a33,var(--ink) 70%)}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pv-head h2{margin:0;font-family:var(--caps);font-size:14px;letter-spacing:.24em;color:var(--gold)}
.pv-head .btns{display:flex;gap:8px}
.frame{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pv-note{font-size:12px;color:var(--muted)}
.fit{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center}
.fit .frame{max-height:100%;width:auto;height:auto;max-width:100%}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="top">
      <div class="logo">IMX<small data-t="tagline"></small></div>
      <div class="langs" role="group" aria-label="Interface language">
        <button data-ui="uz">UZ</button><button data-ui="ru">RU</button><button data-ui="en">EN</button>
      </div>
    </div>

    <div class="scroll" id="scroll">
      <!-- 1. presentation -->
      <details class="sec" open data-go="title">
        <summary><span class="n">01</span><span data-t="s_pres"></span><span class="st" id="st1"></span></summary>
        <div class="body">
          <label class="f"><span><span data-t="topic"></span> <b>*</b></span><textarea id="topic" rows="3" data-k="topic"></textarea></label>
          <label class="f"><span data-t="plang"></span>
            <select id="plang"><option value="uz">O'zbekcha</option><option value="ru">Русский</option><option value="en">English</option></select></label>
        </div>
      </details>

      <!-- 2. owner -->
      <details class="sec" data-go="title">
        <summary><span class="n">02</span><span data-t="s_owner"></span><span class="st" id="st2"></span></summary>
        <div class="body">
          <label class="f"><span><span data-t="fullname"></span> <b>*</b></span><input type="text" id="owner" data-k="owner"></label>
          <label class="f"><span data-t="role"></span><input type="text" data-k="ownerRole" data-ph="ph_ownerRole"></label>
          <div class="media" id="m_ownerPhoto"></div>
        </div>
      </details>

      <!-- 3. supervisor / partner -->
      <details class="sec" data-go="title">
        <summary><span class="n">03</span><span data-t="s_sup"></span><span class="st" data-t="optional"></span></summary>
        <div class="body">
          <label class="f"><span data-t="fullname"></span><input type="text" data-k="sup"></label>
          <label class="f"><span data-t="degree"></span><input type="text" data-k="supRole" data-ph="ph_supRole"></label>
          <div class="media" id="m_supPhoto"></div>
        </div>
      </details>

      <!-- 4. university -->
      <details class="sec" data-go="title">
        <summary><span class="n">04</span><span data-t="s_uni"></span><span class="st" data-t="optional"></span></summary>
        <div class="body">
          <label class="f"><span data-t="uniname"></span><input type="text" data-k="uni"></label>
          <div class="media" id="m_uniLogo"></div>
        </div>
      </details>

      <!-- 5. menu / pages -->
      <details class="sec" data-go="reja">
        <summary><span class="n">05</span><span data-t="s_menu"></span><span class="st" id="st5"></span></summary>
        <div class="body">
          <p class="hint" data-t="menuhint"></p>
          <div id="pages" style="display:flex;flex-direction:column;gap:8px"></div>
        </div>
      </details>

      <!-- 6. final page -->
      <details class="sec" data-go="thanks">
        <summary><span class="n">06</span><span data-t="s_final"></span></summary>
        <div class="body">
          <label class="f"><span data-t="thanksword"></span><input type="text" data-k="thanks" data-ph="ph_thanks"></label>
          <label class="f"><span data-t="thankssub"></span><input type="text" data-k="qsub" data-ph="ph_qsub"></label>
        </div>
      </details>

      <!-- 7. voice -->
      <details class="sec">
        <summary><span class="n">07</span><span data-t="s_voice"></span></summary>
        <div class="body">
          <label class="sw"><span data-t="animate"></span><input type="checkbox" id="v_animate"></label>
          <label class="sw"><span data-t="narrate"></span><input type="checkbox" id="v_narrate"></label>
          <label class="sw"><span data-t="control"></span><input type="checkbox" id="v_control"></label>
          <label class="f"><span data-t="vlang"></span>
            <select id="v_lang"><option value="uz-UZ">O'zbekcha</option><option value="ru-RU">Русский</option><option value="en-US">English</option></select></label>
          <p class="hint" data-t="voicehint"></p>
        </div>
      </details>

      <!-- 8. settings -->
      <details class="sec">
        <summary><span class="n">08</span><span data-t="s_settings"></span></summary>
        <div class="body">
          <div class="row2">
            <label class="f"><span data-t="subcol"></span><input type="color" id="c_sub"></label>
            <label class="f"><span data-t="bgcol"></span><input type="color" id="c_bg"></label>
          </div>
          <div class="media" id="m_bgImg"></div>
          <label class="f"><span><span data-t="vis"></span> <output id="visOut"></output></span><input type="range" id="c_vis" min="0" max="100"></label>
          <button class="ghost" id="resetSet" data-t="reset"></button>
        </div>
      </details>
    </div>

    <div class="foot">
      <div class="two">
        <button class="ghost" id="saveBtn" data-t="save"></button>
        <label class="ghost add" style="justify-content:center;border-style:solid"><span data-t="open"></span><input type="file" accept=".json,application/json" id="openFile"></label>
      </div>
      <button class="ghost" id="exampleBtn" data-t="example"></button>
      <button class="create" id="createBtn" data-t="create"></button>
      <div class="missing" id="missing"></div>
    </div>
  </aside>

  <main class="stage-wrap">
    <div class="pv-head">
      <h2 data-t="preview"></h2>
      <div class="btns">
        <button class="ghost" id="fromStart" data-t="fromstart"></button>
        <button class="ghost" id="fullPv" data-t="fullpv"></button>
      </div>
    </div>
    <div class="fit" id="fit"><div class="frame" id="frame"><iframe id="pv" title="Preview"></iframe></div></div>
    <p class="pv-note" data-t="pvnote"></p>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* the presentation player, inserted by build.js */
const PLAYER="<!doctype html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>__IMX_TITLE__<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600&display=swap\">\n<style>\n/* Layout: one 16:9 stage scaled to fit, slides stacked inside it; navy night with gold type. Dark-only by design. */\n:root{\n  --ink:#060a14;\n  --ink-2:#0c1528;\n  --navy:#16264a;\n  --panel:#0f1a31;\n  --gold:#d9b25f;\n  --gold-hi:#f6dc9a;\n  --gold-lo:#8a6a2c;\n  --text:#ece6d8;\n  --muted:#9b9a92;\n  --display:\"Cormorant Garamond\",Georgia,\"Times New Roman\",serif;\n  --caps:\"Cinzel\",\"Trajan Pro\",Georgia,serif;\n  --body:\"Manrope\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  color-scheme:dark;\n}\nhtml,body{margin:0;height:100%;background:#000;color:var(--text);font-family:var(--body);overflow:hidden}\nbutton{cursor:pointer}\n.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}\n.head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}\n.head h1{font-family:var(--caps);font-size:15px;letter-spacing:.32em;color:var(--gold);margin:0;font-weight:700}\n.head p{margin:0;color:var(--muted);font-size:13px}\n\n/* stage */\n.viewport{position:fixed;inset:0;overflow:hidden;background:#000}\n.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;\n  background:radial-gradient(ellipse 60% 70% at 50% 50%,var(--navy) 0%,var(--ink-2) 50%,var(--ink) 100%)}\n#bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;pointer-events:none}\n.range{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)}\n ,1)'});\n  A($('right'),[{transform:'translateX(110%)'},{transform:'translateX(-4%)',offset:.8},{transform:'translateX(0)'}],{duration:T(1100),delay:T(s+120),easing:'cubic-bezier(.25,.9,.25,1)'});\n  [['leftPhoto',-6],['rightPhoto',6]].forEach(([id,r],k)=>A($(id),[{opacity:0,transform:`scale(.6) rotate(${r}deg)`},{opacity:1,transform:'scale(1) rotate(0)'}],{duration:T(800),delay:T(s+700+k*120),easing:'cubic-bezier(.3,1.5,.5,1)'}));\n  ['leftRole','rightRole'].forEach((id,k)=>A($(id),[{opacity:0,letterSpacing:'.8em'},{opacity:1,letterSpacing:'.3em'}],{duration:T(900),delay:T(s+900+k*120)}));\n  [['leftName',-1],['rightName',1]].forEach(([id,dir],k)=>[...$(id).querySelectorAll('.c')].forEach((c,i)=>A(c,[{opacity:0,transform:`translateX(${dir*-40}px) translateY(20px) rotate(${dir*-20}deg)`},{opacity:1,transform:'none'}],{duration:T(500),delay:T(s+1100+k*120+i*35)})));\n  ['leftNote','rightNote'].forEach((id,k)=>A($(id),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:T(700),delay:T(s+1900+k*120)}));\n  timers.push(setTimeout(()=>$('topic').classList.add('shine'),T(topicEnd)));\n  burst=performance.now()+T(1300);\n}\n\n/* ---------- slide 2 ---------- */\nfunction render2(){\n  $('rows').innerHTML=PAGES.map((m,i)=>`\n    <div class=\"row\" tabindex=\"0\" role=\"button\" data-type=\"${m.type}\" aria-label=\"${esc(m.name)}\">\n      <div class=\"lbl\"><span>${esc(m.name)}<\/span><span class=\"arrow\">→<\/span><\/div>\n      <div class=\"bar\"><div class=\"bar-in\"><b>${String(i+1).padStart(2,'0')}<\/b>${esc(m.text)}<\/div><\/div>\n    <\/div>`).join('');\n}\nconst C=2*Math.PI*150;\nfunction play2(){\n  const ring=$('ring'),dot=$('dot'),word=$('rejaWord'),seal=$('seal');\n  ring.style.strokeDasharray=C;ring.style.strokeDashoffset=C;\n  dot.setAttribute('r',0);dot.setAttribute('cx',275);dot.setAttribute('cy',70.1);\n  word.style.strokeDasharray=520;word.style.strokeDashoffset=520;word.style.fillOpacity=0;\n  seal.style.transform='none';\n\n b==='line'){q('xh').setAttribute('x1',X(i));q('xh').setAttribute('x2',X(i));q('xh').setAttribute('visibility','visible');\n      q('xd').setAttribute('cx',X(i));q('xd').setAttribute('cy',Y(vals[i]));q('xd').setAttribute('visibility','visible')}\n    else svg.querySelectorAll('.bb').forEach((b,k)=>b.setAttribute('fill',k===i?'#f6dc9a':'#d9b25f'));\n  });\n  svg.addEventListener('pointerleave',()=>{tip.hidden=true;\n    if(tab==='line'){q('xh').setAttribute('visibility','hidden');q('xd').setAttribute('visibility','hidden')}\n    else svg.querySelectorAll('.bb').forEach(b=>b.setAttribute('fill','#d9b25f'))});\n}\n\nfunction wordLetters(P,delay){\n  [...$('wd'+P.sfx).children].forEach((c,i)=>A(c,[{opacity:0,transform:'scale(2.2)',filter:'blur(10px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:T(700),delay:T(delay+i*70)}));\n}\nfunction content(P,t0){const q=id=>$(id+P.sfx);\n  A(q('tl'),[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:T(700),delay:T(t0)});\n  A(q('tr'),[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:T(700),delay:T(t0)});\n  A(q('tpanel'),[{opacity:0,transform:'translateX(-1000px)'},{opacity:1,transform:'translateX(14px)',offset:.8},{opacity:1,transform:'none'}],{duration:T(1000),delay:T(t0+300)});\n  A(q('ipanel'),[{opacity:0,transform:'translateX(700px)'},{opacity:1,transform:'translateX(-14px)',offset:.8},{opacity:1,transform:'none'}],{duration:T(1000),delay:T(t0+300)});\n  A(q('chev'),[{opacity:0,transform:'scaleX(.2)'},{opacity:1,transform:'none'}],{duration:T(600),delay:T(t0+1100)});\n  A(q('tbody'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:T(700),delay:T(t0+1100)});\n  A(q('cpanel'),[{transform:'translateY(330px)'},{transform:'translateY(0)'}],{duration:T(900),delay:T(t0+1300),easing:'cubic-bezier(.2,.9,.25,1)'});\n  P.tab='line';drawChart(P,t0+2100);\n}\nconst TITLE_T='translateY(-368px) scale(.62)';\nfunction playBook(P){const q=id=>$(id+P.sfx),vl=q('vidlayer');\n  if(P const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
/* pictures are shrunk to at most 1600px so the finished file stays small */
async function readImage(file,max=1600){
  const url=await readURL(file);if(/svg|gif/.test(file.type))return url;
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const k=Math.min(1,max/Math.max(img.width,img.height));if(k===1&&file.size<600000)return url;
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.86)}
const parseNums=(s,sep)=>String(s).split(sep).map(x=>parseFloat(x.trim().replace(',','.'))).filter(x=>!isNaN(x));
const fmtNum=v=>String(v).replace('.',',');

/* ---------- media pickers ---------- */
function picker(box,{get,set,label,round,accept='image/*'}){
  const el=$(box)||box;
  const draw=()=>{const v=get();
    el.innerHTML=(v?`<span class="thumb${round?' round':''}"><img alt="" src="${v}"><button class="x" aria-label="${esc(t('remove'))}">✕</button></span>`:'')+
      `<label class="add">${esc(t(label))}<input type="file" accept="${accept}"></label>`;
    el.querySelector('input').onchange=async e=>{const f=e.target.files[0];if(!f)return;set(await readImage(f));draw();changed()};
    const x=el.querySelector('.x');if(x)x.onclick=()=>{set('');draw();changed()}};
  draw();return draw}
function videoPicker(el,key,obj,field){
  const draw=()=>{const v=obj()[field];
    el.innerHTML=(v&&VIDEOS[v]?`<span class="chipfile">🎬 ${esc(VIDEOS[v].name)} <button aria-label="${esc(t('remove'))}">✕</button></span>`:'')+
      `<label class="add">${esc(t('addVideo'))}<input type="file" accept="video/*"></label>`;
    el.querySelector('input').onchange=e=>{const f=e.target.files[0];if(!f)return;
      VIDEOS[key]={blob:f,name:f.name,url:URL.createObjectURL(f)};obj()[field]=key;if(f.size>60e6)toast(t('bigvideo'));draw();changed()};
    const b=el.querySelector('.chipfile button');if(b)b.onclick=()=>{obj()[field]='';draw();changed()}};
  draw()}

/* ---------- page editors ---------- */
const openPages=new Set();
function chartFields(c){return `
  <div class="row2"><label class="f"><span>${esc(t('chartTitle'))}</span><input type="text" data-c="title" value="${esc(c.title)}"></label>
  <label class="f"><span>${esc(t('unit'))}</span><input type="text" data-c="unit" value="${esc(c.unit)}"></label></div>
  <label class="f"><span>${esc(t('years'))}</span><input type="text" data-c="years" value="${esc(c.years.join(', '))}" placeholder="2020, 2021, 2022"></label>
  <label class="f"><span>${esc(t('vals'))}</span><input type="text" data-c="vals" value="${esc(c.vals.map(fmtNum).join('; '))}" placeholder="1,5; 1,9; 5,2"></label>
  <p class="hint">${esc(t('chartHint'))}</p>`}
function bindChart(root,c){root.querySelectorAll('[data-c]').forEach(inp=>inp.oninput=()=>{const k=inp.dataset.c;
  if(k==='years')c.years=parseNums(inp.value,/[,;\s]+/).map(Math.round);else if(k==='vals')c.vals=parseNums(inp.value,/[;\s]+/);else c[k]=inp.value;
  c.sample=false;const bad=c.years.length&&c.vals.length&&c.years.length!==c.vals.length;
  root.querySelector('[data-c=vals]').classList.toggle('bad',!!bad);changed()})}

function pageBody(p){
  const d=document.createElement('div');d.className='pbody';
  if(p.type==='intro'||p.type==='conclusion'){
    const o=p.type==='intro'?null:S.concl;
    d.innerHTML=`<label class="f"><span>${esc(t('text'))}</span><textarea rows="5" data-f="text">${esc(o?o.text:S.intro)}</textarea></label>
      <div class="media" data-m="img"></div><div class="media" data-m="vid"></div><p class="hint">${esc(t('videoHint'))}</p>${chartFields(o?o.chart:S.chart)}`;
    d.querySelector('[data-f=text]').oninput=e=>{if(o)o.text=e.target.value;else S.intro=e.target.value;changed()};
    picker(d.querySelector('[data-m=img]'),{get:()=>o?o.img:S.introImg,set:v=>{if(o)o.img=v;else S.introImg=v},label:'addImg'});
    videoPicker(d.querySelector('[data-m=vid]'),'v_'+p.type,()=>o||S,o?'video':'video');
    bindChart(d,o?o.chart:S.chart);
  }else if(p.type==='problems'){
    d.innerHTML=`<label class="f"><span>${esc(t('problemsList'))}</span><textarea rows="5" data-f="list">${esc(S.problems.join('\n'))}</textarea></label>
      <div class="media" data-m="imgs"></div><div class="media" data-m="vid"></div><p class="hint">${esc(t('videoHint'))}</p>`;
    d.querySelector('[data-f=list]').oninput=e=>{S.problems=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6);changed()};
    const imgs=d.querySelector('[data-m=imgs]');
    const drawImgs=()=>{imgs.innerHTML=S.problemImgs.map((src,i)=>`<span class="thumb"><img alt="" src="${src}"><button class="x" data-i="${i}" aria-label="${esc(t('remove'))}">✕</button></span>`).join('')+
        (S.problemImgs.length<10?`<label class="add">${esc(t('addImgs'))}<input type="file" accept="image/*" multiple></label>`:'');
      const inp=imgs.querySelector('input');if(inp)inp.onchange=async e=>{const fs=[...e.target.files].slice(0,10-S.problemImgs.length);
        for(const f of fs)S.problemImgs.push(await readImage(f));drawImgs();changed()};
      imgs.querySelectorAll('.x').forEach(b=>b.onclick=()=>{S.problemImgs.splice(+b.dataset.i,1);drawImgs();changed()})};
    drawImgs();videoPicker(d.querySelector('[data-m=vid]'),'v_problems',()=>S,'video4');
  }else if(p.type==='plans'){
    d.innerHTML=S.plans.map((pl,i)=>`<div class="card"><b style="color:var(--gold);font-size:12px">${esc(t('plan'))} ${i+1}</b>
      <input type="text" data-i="${i}" data-x="h" placeholder="${esc(t('heading'))}" value="${esc(pl.h)}">
      <textarea rows="2" data-i="${i}" data-x="p" placeholder="${esc(t('text'))}">${esc(pl.p)}</textarea></div>`).join('')+`<div class="media" data-m="vid"></div>`;
    d.querySelectorAll('[data-x]').forEach(inp=>inp.oninput=()=>{S.plans[+inp.dataset.i][inp.dataset.x]=inp.value;changed()});
    videoPicker(d.querySelector('[data-m=vid]'),'v_plans',()=>S,'video5');
  }else if(p.type==='solutions'){
    const list=document.createElement('div');list.style.cssText='display:flex;flex-direction:column;gap:8px';
    const draw=()=>{list.innerHTML='';S.cards.forEach((c,i)=>{const el=document.createElement('div');el.className='card';
        el.innerHTML=`<b style="color:var(--gold);font-size:12px">${esc(t('card'))} ${i+1}</b>
          ${S.cards.length>1?`<button class="icon del" aria-label="${esc(t('remove'))}">✕</button>`:''}
          <input type="text" data-x="h" placeholder="${esc(t('heading'))}" value="${esc(c.h)}">
          <textarea rows="2" data-x="p" placeholder="${esc(t('text'))}">${esc(c.p)}</textarea><div class="media"></div>`;
        el.querySelectorAll('[data-x]').forEach(inp=>inp.oninput=()=>{c[inp.dataset.x]=inp.value;changed()});
        picker(el.querySelector('.media'),{get:()=>c.img,set:v=>c.img=v,label:'addImg'});
        const del=el.querySelector('.del');if(del)del.onclick=()=>{S.cards.splice(i,1);draw();changed()};
        list.appendChild(el)});};
    draw();d.appendChild(list);
    const add=document.createElement('button');add.className='ghost';add.textContent=t('addCard');
    add.onclick=()=>{S.cards.push({h:'',p:'',img:''});draw();changed();list.lastChild.querySelector('input').focus()};
    d.appendChild(add);const v=document.createElement('div');v.className='media';d.appendChild(v);
    videoPicker(v,'v_solutions',()=>S,'video6');
  }
  return d}

function drawPages(){
  const box=$('pages');box.innerHTML='';
  S.menu.forEach((p,i)=>{
    const el=document.createElement('div');el.className='page'+(p.on?'':' off');el.dataset.type=p.type;
    el.innerHTML=`<div class="phead">
        <label class="sw" title="${esc(p.on?t('on'):t('off'))}"><input type="checkbox" ${p.on?'checked':''} aria-label="${esc(t('t_'+p.type))}"></label>
        <span class="type">${esc(t('t_'+p.type))}</span>
        <button class="icon" data-mv="-1" ${i===0?'disabled':''} aria-label="${esc(t('up'))}">↑</button>
        <button class="icon" data-mv="1" ${i===S.menu.length-1?'disabled':''} aria-label="${esc(t('down'))}">↓</button>
        <button class="icon" data-open aria-expanded="${openPages.has(p.type)}" aria-label="${esc(t('show'))}">${openPages.has(p.type)?'▴':'▾'}</button>
      </div>`;
    const sub=document.createElement('div');sub.className='pbody';sub.style.borderTop='0';sub.style.paddingTop='0';
    sub.innerHTML=`<div class="row2"><label class="f"><span>${esc(t('pname'))}</span><input type="text" data-n="name" value="${esc(p.name)}" placeholder="${esc(PLAYER_DEF[S.lang][p.type])}"></label>
      <label class="f"><span>${esc(t('pdesc'))}</span><input type="text" data-n="text" value="${esc(p.text)}"></label></div>`;
    el.appendChild(sub);
    if(openPages.has(p.type))el.appendChild(pageBody(p));
    el.querySelector('.phead input').onchange=e=>{p.on=e.target.checked;el.classList.toggle('off',!p.on);changed(p.type)};
    el.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const j=i+ +b.dataset.mv;[S.menu[i],S.menu[j]]=[S.menu[j],S.menu[i]];drawPages();changed(p.type)});
    el.querySelector('[data-open]').onclick=()=>{openPages.has(p.type)?openPages.delete(p.type):openPages.add(p.type);drawPages();focusType=p.type;refresh(true)};
    sub.querySelectorAll('[data-n]').forEach(inp=>inp.oninput=()=>{p[inp.dataset.n]=inp.value;changed(p.type)});
    el.addEventListener('focusin',()=>{focusType=p.type});
    box.appendChild(el)});
}
const PLAYER_DEF={uz:{intro:'KIRISH',problems:'MUAMMOLAR',plans:'REJALAR',solutions:'YECHIMLAR',conclusion:'XULOSA'},
  ru:{intro:'ВВЕДЕНИЕ',problems:'ПРОБЛЕМЫ',plans:'ПЛАНЫ',solutions:'РЕШЕНИЯ',conclusion:'ЗАКЛЮЧЕНИЕ'},
  en:{intro:'INTRODUCTION',problems:'PROBLEMS',plans:'PLANS',solutions:'SOLUTIONS',conclusion:'CONCLUSION'}};

/* ---------- simple bound fields ---------- */
function bindSimple(){
  document.querySelectorAll('[data-k]').forEach(inp=>{inp.value=S[inp.dataset.k]||'';
    inp.oninput=()=>{S[inp.dataset.k]=inp.value;changed()}});
  $('plang').value=S.lang;
  $('v_animate').checked=S.voice.animate!==false;$('v_narrate').checked=!!S.voice.narrate;$('v_control').checked=!!S.voice.control;$('v_lang').value=S.voice.lang;
  $('c_sub').value=S.settings.sub;$('c_bg').value=S.settings.bg;$('c_vis').value=S.settings.vis;$('visOut').textContent=S.settings.vis+'%';

$('plang').onchange=e=>{S.lang=e.target.value;S.voice.lang={uz:'uz-UZ',ru:'ru-RU',en:'en-US'}[S.lang];$('v_lang').value=S.voice.lang;applyPlaceholders();drawPages();changed()};
[['v_animate','animate'],['v_narrate','narrate'],['v_control','control']].forEach(([id,k])=>$(id).onchange=e=>{S.voice[k]=e.target.checked;changed()});
$('v_lang').onchange=e=>{S.voice.lang=e.target.value;changed()};
$('c_sub').oninput=e=>{S.settings.sub=e.target.value;changed()};
$('c_bg').oninput=e=>{S.settings.bg=e.target.value;changed()};
$('c_vis').oninput=e=>{S.settings.vis=+e.target.value;$('visOut').textContent=S.settings.vis+'%';changed()};
$('resetSet').onclick=()=>{S.settings={sub:'#d9b25f',bg:'#16264a',bgImg:'',vis:35};bindSimple();drawMedia();changed()};

let mediaDraws=[];
function drawMedia(){mediaDraws=[
  picker('m_ownerPhoto',{get:()=>S.ownerPhoto,set:v=>S.ownerPhoto=v,label:'addPhoto'}),
  picker('m_supPhoto',{get:()=>S.supPhoto,set:v=>S.supPhoto=v,label:'addPhoto'}),
  picker('m_uniLogo',{get:()=>S.uniLogo,set:v=>S.uniLogo=v,label:'addLogo',round:true}),
  picker('m_bgImg',{get:()=>S.settings.bgImg,set:v=>S.settings.bgImg=v,label:'addBg'})]}

function applyPlaceholders(){document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=PH[S.lang][el.dataset.ph])}
function applyUI(){
  document.documentElement.lang=ui;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ui===ui));
  drawMedia();drawPages();validate();
}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{ui=b.dataset.ui;try{localStorage.setItem('imx-ui',ui)}catch(_){}applyUI()});

/* ---------- validation: CREATE stays locked until name and topic are filled ---------- */
function validate(){
  const miss=[];if(!S.topic.trim())miss.push(t('topic'));if(!S.owner.trim())miss.push(t('fullname'));
  $('createBtn').disabled=miss.length>0;
  $('missing').textContent=miss.length?`${t('need')} ${miss.join(', ')}`:'';$('missing').style.color=miss.length?'':'var(--ok)';
  $('st1').textContent=S.topic.trim()?'✓':'*';$('st1').className='st '+(S.topic.trim()?'done':'req');
  $('st2').textContent=S.owner.trim()?'✓':'*';$('st2').className='st '+(S.owner.trim()?'done':'req');
  $('st5').textContent=`${S.menu.filter(p=>p.on).length} ${t('pages')}`;
}

/* ---------- live preview ---------- */
let focusType='title',pvTimer=0;
function slideIndexFor(type){
  const on=S.menu.filter(p=>p.on);if(type==='title')return 0;if(type==='reja')return on.length?1:0;
  if(type==='thanks')return 1+(on.length?1:0)+on.length;
  const k=on.findIndex(p=>p.type===type);return k<0?0:2+k}
function presentationData(videoMode,start){
  const d=JSON.parse(JSON.stringify(S));
  for(const [o,f] of [[d,'video'],[d,'video4'],[d,'video5'],[d,'video6'],[d.concl,'video']]){const v=o[f];o[f]=v&&VIDEOS[v]?(videoMode==='url'?VIDEOS[v].url:VIDEOS[v].data||''):''}
  if(start!=null)d.startAt=start;return d}
/* ---------- heading colour: every gold tone in the player is shifted to the chosen colour ---------- */
const GOLD='#d9b25f';
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgbHsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function hslRgb([h,s,l]){const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return[f(0),f(8),f(4)].map(v=>Math.round(v*255))}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let recolorCache={key:'',out:''};
function recolor(src,sub){
  if(!/^#[0-9a-f]{6}$/i.test(sub||'')||sub.toLowerCase()===GOLD)return src;
  if(recolorCache.key===sub)return recolorCache.out;
  const [gh,gs,gl]=rgbHsl(hexRgb(GOLD)),[nh,ns,nl]=rgbHsl(hexRgb(sub));
  const map=rgb=>{const [h,s,l]=rgbHsl(rgb);if(h<22||h>58||s<.4)return null;  /* only the gold family changes */
    return hslRgb([nh,clamp(s*ns/gs,0,1),clamp(l+(nl-gl)*(1-Math.abs(2*l-1)),0,1)])};
  const hex=c=>c.map(v=>v.toString(16).padStart(2,'0')).join('');
  let out=src.replace(/(#|%23)([0-9a-fA-F]{6})\b/g,(m,p,h)=>{const r=map(hexRgb('#'+h));return r?p+hex(r):m});
  out=out.replace(/rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})/g,(m,a,b,c)=>{const r=map([+a,+b,+c]);return r?m.replace(/\(.*$/,`(${r.join(',')}`):m});
  recolorCache={key:sub,out};return out}
function playerHTML(d){
  const json=JSON.stringify(d).replace(/</g,'\\u003c');
  return recolor(PLAYER,d.settings&&d.settings.sub).replace('__IMX_DATA__',()=>json).replace('__IMX_TITLE__',()=>esc(d.topic||'IMX'))}
function refresh(now){clearTimeout(pvTimer);pvTimer=setTimeout(()=>{
  $('pv').srcdoc=playerHTML(presentationData('url',slideIndexFor(focusType)))},now?0:650)}
function changed(type){if(type)focusType=type;validate();autosave();refresh()}
document.querySelectorAll('.sec').forEach(sec=>sec.addEventListener('focusin',e=>{if(!e.target.closest('.page')&&sec.dataset.go)focusType=sec.dataset.go}));
document.querySelectorAll('.sec').forEach(sec=>sec.addEventListener('toggle',()=>{if(sec.open&&sec.dataset.go){focusType=sec.dataset.go;refresh(true)}}));
$('fromStart').onclick=()=>{focusType='title';refresh(true)};
$('fullPv').onclick=()=>{const f=$('frame');try{f.requestFullscreen().catch(()=>{})}catch(_){}};
function sizeFrame(){const box=$('fit'),w=box.clientWidth,h=box.clientHeight;if(!h)return;const k=Math.min(w/16,h/9);$('frame').style.width=Math.floor(k*16)+'px';$('frame').style.height=Math.floor(k*9)+'px'}
new ResizeObserver(sizeFrame).observe($('fit'));

/* ---------- create, save, open ---------- */
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const fileName=ext=>((S.topic.trim()||'IMX').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').slice(0,60).trim()||'IMX')+ext;
async function embedVideos(){for(const v of Object.values(VIDEOS))if(!v.data)v.data=await readURL(v.blob)}
$('createBtn').onclick=async()=>{
  if($('createBtn').disabled)return;$('createBtn').disabled=true;
  try{await embedVideos();const d=presentationData('data',0);delete d.startAt;
    const name=fileName('.html');download(name,new Blob([playerHTML(d)],{type:'text/html'}));toast(`${t('created')} ${name}`)}
  finally{validate()}};
$('saveBtn').onclick=async()=>{await embedVideos();
  const p={imx:1,state:S,videos:Object.fromEntries(Object.entries(VIDEOS).map(([k,v])=>[k,{name:v.name,data:v.data}]))};
  download(fileName('.imx.json'),new Blob([JSON.stringify(p)],{type:'application/json'}));toast(t('saved'))};
$('openFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const p=JSON.parse(await f.text());if(!p||p.imx!==1||!p.state)throw 0;
    for(const [k,v] of Object.entries(p.videos||{})){const blob=await (await fetch(v.data)).blob();VIDEOS[k]={blob,name:v.name,data:v.data,url:URL.createObjectURL(blob)}}
    load(p.state);toast(t('opened'))}catch(_){toast(t('badfile'))}};
let exArm=0;
$('exampleBtn').onclick=()=>{const filled=S.topic.trim()||S.owner.trim();
  if(filled&&Date.now()-exArm>3000){exArm=Date.now();toast(t('confirmEx'));return}
  load(example())};

/* ---------- load and autosave (text and pictures; videos are kept only in saved projects) ---------- */
function merge(base,src){for(const k in src){if(src[k]&&typeof src[k]==='object'&&!Array.isArray(src[k])&&base[k]&&typeof base[k]==='object')merge(base[k],src[k]);else if(src[k]!==undefined)base[k]=src[k]}return base}
function load(state){S=merge(blank(),state);
  const types=S.menu.map(p=>p.type);if(TYPES.some(x=>!types.includes(x)))S.menu=blank().menu;
  while(S.plans.length<4)S.plans.push({h:'',p:''});if(!S.cards.length)S.cards=[{h:'',p:'',img:''}];
  bindSimple();applyPlaceholders();drawMedia();drawPages();validate();focusType='title';refresh(true);autosave()}
let saveT=0;
function autosave(){clearTimeout(saveT);saveT=setTimeout(()=>{try{
  const d=JSON.parse(JSON.stringify(S));for(const [o,f] of [[d,'video'],[d,'video4'],[d,'video5'],[d,'video6'],[d.concl,'video']])o[f]='';
  localStorage.setItem('imx-project',JSON.stringify(d))}catch(_){}},800)}

/* ---------- start ---------- */
try{ui=localStorage.getItem('imx-ui')||ui}catch(_){}
if(!UI[ui])ui='uz';
let saved=null;try{saved=JSON.parse(localStorage.getItem('imx-project')||'null')}catch(_){}
applyUI();load(saved||blank());
</script>
